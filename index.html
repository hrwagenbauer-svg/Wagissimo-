<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<link rel="manifest" href="manifest.json">
<title>Wagissimo</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(145deg,#312e81,#7e22ce);color:#111;min-height:100vh}
.app{max-width:520px;margin:auto;padding:28px 18px 40px}.logo{color:white;text-align:center;font-size:34px;font-weight:900;letter-spacing:.5px}.sub{color:#eee;text-align:center;margin:6px 0 22px}
nav{display:flex;background:#ffffff22;border-radius:14px;padding:4px;margin-bottom:18px}nav button{flex:1;border:0;background:none;color:white;padding:11px;border-radius:10px;font-weight:700}nav button.active{background:white;color:#4c1d95}
.card{background:white;border-radius:28px;padding:28px 22px;box-shadow:0 18px 45px #0003;text-align:center;min-height:330px;display:flex;flex-direction:column;justify-content:center}
.badge{font-size:12px;font-weight:800;color:#6b21a8;letter-spacing:1px}.term{font-size:42px;font-weight:850;margin:18px 0}.answer{font-size:21px;line-height:1.35}.btn{border:0;border-radius:14px;padding:14px 18px;font-size:17px;font-weight:800;background:#5b21b6;color:white;margin-top:22px}.stats{text-align:center;color:white;margin-top:18px;font-weight:700}.answers{display:grid;gap:10px;margin-top:20px}.answers button{border:0;border-radius:14px;background:#f3e8ff;padding:14px;font-size:16px;text-align:left}.small{font-size:14px;color:#666;margin-top:18px}
</style>
</head>
<body>
<div class="app">
<div class="logo">🎼 WAGISSIMO</div><div class="sub">Musik lernen. Aber bitte mit Wagi. 😎</div>
<nav><button type="button" id="learnTab" class="active">Lernen</button><button type="button" id="quizTab">Quiz</button></nav>
<div id="content"></div><div class="stats" id="stats"></div>
</div>
<script>
const terms=[
["Allegro","Schnell, lebhaft.","Tempo"],["Andante","Gehend, mäßig langsam.","Tempo"],["Adagio","Langsam, ruhig.","Tempo"],["Largo","Sehr langsam und breit.","Tempo"],["Presto","Sehr schnell.","Tempo"],["Moderato","Mäßig, gemäßigt.","Tempo"],["Accelerando","Allmählich schneller werden.","Tempo"],["Ritardando","Allmählich langsamer werden.","Tempo"],["A tempo","Zum ursprünglichen Tempo zurückkehren.","Tempo"],["Rubato","Freie, flexible Gestaltung des Tempos.","Tempo"],["piano (p)","Leise.","Dynamik"],["forte (f)","Laut, kräftig.","Dynamik"],["pianissimo (pp)","Sehr leise.","Dynamik"],["fortissimo (ff)","Sehr laut.","Dynamik"],["crescendo","Allmählich lauter werden.","Dynamik"],["diminuendo","Allmählich leiser werden.","Dynamik"],["sforzando (sfz)","Plötzliche starke Betonung.","Dynamik"],["legato","Gebunden, ohne hörbare Unterbrechungen.","Artikulation"],["staccato","Kurz und deutlich abgesetzt.","Artikulation"],["tenuto","Einen Ton voll bzw. gehalten spielen.","Artikulation"]];
let i=0,revealed=false,score=0,mode="learn";
const content=document.getElementById("content"),stats=document.getElementById("stats");
function render(){
 if(mode==="learn") content.innerHTML=`<div class="card"><div class="badge">${terms[i][2].toUpperCase()}</div><div class="term">${terms[i][0]}</div>${revealed?`<div class="answer">${terms[i][1]}</div>`:`<div class="small">Was bedeutet das?</div>`}<button type="button" class="btn" onclick="${revealed?'next()':'show()'}">${revealed?"Weiter →":"Antwort zeigen"}</button></div>`;
 else {
  let opts=[terms[i][1]];while(opts.length<4){let x=terms[Math.floor(Math.random()*terms.length)][1];if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);
  content.innerHTML=`<div class="card"><div class="badge">QUIZ · ${terms[i][2].toUpperCase()}</div><div class="term">${terms[i][0]}</div><div class="answers">${opts.map(x=>`<button type="button" data-answer="${encodeURIComponent(x)}">${x}</button>`).join("")}</div><div class="small">Wagi sagt: „Keine Sorge. Mozart hat auch klein angefangen.“ 😎</div></div>`;
  document.querySelectorAll(".answers button").forEach(b=>b.addEventListener("click",()=>answer(decodeURIComponent(b.dataset.answer))));
 }
 stats.textContent=`Begriff ${i+1} von ${terms.length} · Punkte: ${score}`;
}
function show(){revealed=true;render()}
function next(){i=(i+1)%terms.length;revealed=false;render()}
function answer(x){if(x===terms[i][1])score++;next()}
learnTab.onclick=()=>{mode="learn";learnTab.classList.add("active");quizTab.classList.remove("active");render()}
quizTab.onclick=()=>{mode="quiz";quizTab.classList.add("active");learnTab.classList.remove("active");render()}
render();
if("serviceWorker"in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body></html>

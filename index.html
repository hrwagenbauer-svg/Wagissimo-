<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<link rel="manifest" href="manifest.json">
<title>Wagissimo</title>
<style>
:root{--purple:#5b21b6;--dark:#312e81}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:linear-gradient(145deg,var(--dark),#7e22ce);color:#111;min-height:100vh}.app{max-width:560px;margin:auto;padding:26px 16px 42px}.logo{text-align:center;color:#fff;font-size:34px;font-weight:900}.sub{text-align:center;color:#eee;margin:5px 0 18px}.nav{display:flex;background:#ffffff25;border-radius:15px;padding:4px;margin-bottom:16px}.nav button{flex:1;border:0;background:none;color:#fff;padding:11px;border-radius:11px;font-weight:800}.nav button.active{background:#fff;color:#4c1d95}.card{background:#fff;border-radius:28px;padding:25px 20px;box-shadow:0 18px 45px #0003}.center{text-align:center}.badge{font-size:12px;font-weight:900;letter-spacing:1px;color:#6b21a8}.term{font-size:38px;font-weight:900;margin:15px 0}.meaning{font-size:21px;line-height:1.35}.btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:850;background:var(--purple);color:#fff;margin-top:18px}.btn.secondary{background:#f3e8ff;color:#4c1d95}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f6f3ff;border-radius:18px;padding:16px;text-align:center}.stat b{display:block;font-size:28px;color:#4c1d95}.answers{display:grid;gap:10px;margin-top:18px}.answers button{border:0;border-radius:14px;background:#f3e8ff;padding:15px;text-align:left;font-size:16px;font-weight:650}.answers button:disabled{opacity:.65}.small{font-size:14px;color:#666;margin-top:15px}.progress{height:8px;background:#eee;border-radius:8px;overflow:hidden;margin:12px 0 20px}.bar{height:100%;background:#7c3aed}.resultScore{font-size:64px;font-weight:950;color:#5b21b6}.category{display:inline-block;background:#f3e8ff;color:#6b21a8;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:800;margin:3px}.feedback{margin-top:14px;padding:12px;border-radius:14px;background:#fafafa;font-size:14px}.homeTitle{font-size:28px;font-weight:900}.list{margin-top:16px;display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;background:#f7f5fb;border-radius:14px}.row span:last-child{color:#6b21a8;font-weight:800}
</style>
</head>
<body>
<div class="app">
<div class="logo">🎼 WAGISSIMO</div>
<div class="sub">Musik lernen. Aber bitte mit Wagi. 😎</div>
<div class="nav">
<button id="homeTab" type="button">Start</button><button id="learnTab" type="button">Lernen</button><button id="quizTab" type="button">Quiz</button><button id="statsTab" type="button">Statistik</button>
</div>
<div id="content"></div>
</div>
<script>
const TERMS=[{"id": 1, "term": "Allegro", "meaning": "Schnell, lebhaft.", "category": "Tempo"}, {"id": 2, "term": "Andante", "meaning": "Gehend, mäßig langsam.", "category": "Tempo"}, {"id": 3, "term": "Adagio", "meaning": "Langsam, ruhig.", "category": "Tempo"}, {"id": 4, "term": "Largo", "meaning": "Sehr langsam und breit.", "category": "Tempo"}, {"id": 5, "term": "Presto", "meaning": "Sehr schnell.", "category": "Tempo"}, {"id": 6, "term": "Moderato", "meaning": "Mäßig, gemäßigt.", "category": "Tempo"}, {"id": 7, "term": "Grave", "meaning": "Sehr langsam, schwer und ernst.", "category": "Tempo"}, {"id": 8, "term": "Lento", "meaning": "Langsam.", "category": "Tempo"}, {"id": 9, "term": "Vivace", "meaning": "Lebhaft, bewegt.", "category": "Tempo"}, {"id": 10, "term": "Prestissimo", "meaning": "Extrem schnell.", "category": "Tempo"}, {"id": 11, "term": "Allegretto", "meaning": "Etwas langsamer/leichter als Allegro.", "category": "Tempo"}, {"id": 12, "term": "Andantino", "meaning": "Etwas schneller als Andante.", "category": "Tempo"}, {"id": 13, "term": "Accelerando", "meaning": "Allmählich schneller werden.", "category": "Tempo"}, {"id": 14, "term": "Ritardando", "meaning": "Allmählich langsamer werden.", "category": "Tempo"}, {"id": 15, "term": "Rallentando", "meaning": "Allmählich langsamer werden.", "category": "Tempo"}, {"id": 16, "term": "A tempo", "meaning": "Zum vorherigen Tempo zurückkehren.", "category": "Tempo"}, {"id": 17, "term": "Tempo primo", "meaning": "Zum ursprünglichen Tempo zurückkehren.", "category": "Tempo"}, {"id": 18, "term": "Rubato", "meaning": "Freie, flexible Gestaltung des Tempos.", "category": "Tempo"}, {"id": 19, "term": "Piano (p)", "meaning": "Leise.", "category": "Dynamik"}, {"id": 20, "term": "Pianissimo (pp)", "meaning": "Sehr leise.", "category": "Dynamik"}, {"id": 21, "term": "Mezzo piano (mp)", "meaning": "Mäßig leise.", "category": "Dynamik"}, {"id": 22, "term": "Mezzo forte (mf)", "meaning": "Mäßig laut.", "category": "Dynamik"}, {"id": 23, "term": "Forte (f)", "meaning": "Laut, kräftig.", "category": "Dynamik"}, {"id": 24, "term": "Fortissimo (ff)", "meaning": "Sehr laut.", "category": "Dynamik"}, {"id": 25, "term": "Fortississimo (fff)", "meaning": "Extrem laut.", "category": "Dynamik"}, {"id": 26, "term": "Crescendo", "meaning": "Allmählich lauter werden.", "category": "Dynamik"}, {"id": 27, "term": "Diminuendo", "meaning": "Allmählich leiser werden.", "category": "Dynamik"}, {"id": 28, "term": "Decrescendo", "meaning": "Allmählich leiser werden.", "category": "Dynamik"}, {"id": 29, "term": "Sforzando (sfz)", "meaning": "Plötzliche starke Betonung.", "category": "Dynamik"}, {"id": 30, "term": "Forte piano (fp)", "meaning": "Laut beginnen, sofort leise werden.", "category": "Dynamik"}, {"id": 31, "term": "Legato", "meaning": "Gebunden und fließend spielen.", "category": "Artikulation"}, {"id": 32, "term": "Staccato", "meaning": "Kurz und deutlich abgesetzt.", "category": "Artikulation"}, {"id": 33, "term": "Staccatissimo", "meaning": "Sehr kurz und stark abgesetzt.", "category": "Artikulation"}, {"id": 34, "term": "Tenuto", "meaning": "Den Ton voll bzw. gehalten spielen.", "category": "Artikulation"}, {"id": 35, "term": "Marcato", "meaning": "Deutlich betont spielen.", "category": "Artikulation"}, {"id": 36, "term": "Accent", "meaning": "Einen Ton hervorheben.", "category": "Artikulation"}, {"id": 37, "term": "Portato", "meaning": "Leicht getrennt, aber mit gebundenem Charakter.", "category": "Artikulation"}, {"id": 38, "term": "Fermate", "meaning": "Ton oder Pause länger halten.", "category": "Artikulation"}, {"id": 39, "term": "Glissando", "meaning": "Gleitend über viele Tonhöhen.", "category": "Artikulation"}, {"id": 40, "term": "Arpeggio", "meaning": "Akkordtöne nacheinander spielen.", "category": "Artikulation"}, {"id": 41, "term": "Triller", "meaning": "Schneller Wechsel mit dem benachbarten Ton.", "category": "Verzierungen"}, {"id": 42, "term": "Mordent", "meaning": "Kurzer Wechsel zum Nachbarton und zurück.", "category": "Verzierungen"}, {"id": 43, "term": "Vorschlag", "meaning": "Kurzer Ton unmittelbar vor dem Hauptton.", "category": "Verzierungen"}, {"id": 44, "term": "Nachschlag", "meaning": "Kurze Verzierung nach dem Hauptton.", "category": "Verzierungen"}, {"id": 45, "term": "Tremolo", "meaning": "Sehr schnelle Wiederholung oder Wechsel.", "category": "Verzierungen"}, {"id": 46, "term": "Gruppetto", "meaning": "Verzierung aus Haupt- und Nachbartönen.", "category": "Verzierungen"}, {"id": 47, "term": "Takt", "meaning": "Metrische Einteilung der Musik.", "category": "Rhythmus"}, {"id": 48, "term": "Taktart", "meaning": "Angabe von Zählzeit und Taktstruktur.", "category": "Rhythmus"}, {"id": 49, "term": "Metrum", "meaning": "Regelmäßiges Muster von betonten und unbetonten Schlägen.", "category": "Rhythmus"}, {"id": 50, "term": "Puls", "meaning": "Regelmäßiger Grundschlag der Musik.", "category": "Rhythmus"}, {"id": 51, "term": "Auftakt", "meaning": "Unvollständiger Takt am Anfang eines Stücks.", "category": "Rhythmus"}, {"id": 52, "term": "Synkope", "meaning": "Betonung auf einer normalerweise unbetonten Zählzeit.", "category": "Rhythmus"}, {"id": 53, "term": "Triolen", "meaning": "Drei gleichmäßige Töne im Raum von zwei.", "category": "Rhythmus"}, {"id": 54, "term": "Duolen", "meaning": "Zwei Töne im Raum einer regulären Dreierteilung.", "category": "Rhythmus"}, {"id": 55, "term": "Polyrhythmik", "meaning": "Mehrere unterschiedliche Rhythmen gleichzeitig.", "category": "Rhythmus"}, {"id": 56, "term": "Offbeat", "meaning": "Betonung zwischen den Grundschlägen.", "category": "Rhythmus"}, {"id": 57, "term": "Dur", "meaning": "Tongeschlecht mit großer Terz über dem Grundton.", "category": "Harmonie"}, {"id": 58, "term": "Moll", "meaning": "Tongeschlecht mit kleiner Terz über dem Grundton.", "category": "Harmonie"}, {"id": 59, "term": "Tonika", "meaning": "Grundakkord bzw. tonales Zentrum einer Tonart.", "category": "Harmonie"}, {"id": 60, "term": "Dominante", "meaning": "Fünfte Stufe mit starker Spannung zur Tonika.", "category": "Harmonie"}, {"id": 61, "term": "Subdominante", "meaning": "Vierte Stufe einer Tonart.", "category": "Harmonie"}, {"id": 62, "term": "Kadenz", "meaning": "Harmonische Folge mit meist schließender Wirkung.", "category": "Harmonie"}, {"id": 63, "term": "Akkord", "meaning": "Mehrere gleichzeitig erklingende Töne.", "category": "Harmonie"}, {"id": 64, "term": "Dreiklang", "meaning": "Akkord aus drei unterschiedlichen Tonstufen.", "category": "Harmonie"}, {"id": 65, "term": "Septakkord", "meaning": "Akkord mit zusätzlicher Septime.", "category": "Harmonie"}, {"id": 66, "term": "Dissonanz", "meaning": "Spannungsreicher Zusammenklang.", "category": "Harmonie"}, {"id": 67, "term": "Konsonanz", "meaning": "Zusammenklang mit vergleichsweise stabiler Wirkung.", "category": "Harmonie"}, {"id": 68, "term": "Vorhalt", "meaning": "Dissonanter Ton, der sich typischerweise auflöst.", "category": "Harmonie"}, {"id": 69, "term": "Leitton", "meaning": "Ton mit starker Tendenz zum Grundton.", "category": "Harmonie"}, {"id": 70, "term": "Modulation", "meaning": "Wechsel der Tonart.", "category": "Harmonie"}, {"id": 71, "term": "Chromatik", "meaning": "Verwendung bzw. Bewegung in Halbtonschritten.", "category": "Tonleiter"}, {"id": 72, "term": "Diatonik", "meaning": "Töne innerhalb einer diatonischen Tonleiterstruktur.", "category": "Tonleiter"}, {"id": 73, "term": "Ganztonleiter", "meaning": "Tonleiter ausschließlich aus Ganztonschritten.", "category": "Tonleiter"}, {"id": 74, "term": "Pentatonik", "meaning": "Tonleiter aus fünf verschiedenen Tönen pro Oktave.", "category": "Tonleiter"}, {"id": 75, "term": "Oktave", "meaning": "Intervall mit Abstand von acht Tonstufen.", "category": "Intervalle"}, {"id": 76, "term": "Prime", "meaning": "Intervall vom Ton zu sich selbst.", "category": "Intervalle"}, {"id": 77, "term": "Sekunde", "meaning": "Intervall zwischen benachbarten Tonstufen.", "category": "Intervalle"}, {"id": 78, "term": "Terz", "meaning": "Intervall über drei Tonstufen.", "category": "Intervalle"}, {"id": 79, "term": "Quarte", "meaning": "Intervall über vier Tonstufen.", "category": "Intervalle"}, {"id": 80, "term": "Quinte", "meaning": "Intervall über fünf Tonstufen.", "category": "Intervalle"}, {"id": 81, "term": "Sexte", "meaning": "Intervall über sechs Tonstufen.", "category": "Intervalle"}, {"id": 82, "term": "Septime", "meaning": "Intervall über sieben Tonstufen.", "category": "Intervalle"}, {"id": 83, "term": "Sonate", "meaning": "Mehrteilige Instrumentalkomposition, oft in mehreren Sätzen.", "category": "Formen"}, {"id": 84, "term": "Sonatenhauptsatzform", "meaning": "Form mit Exposition, Durchführung und Reprise.", "category": "Formen"}, {"id": 85, "term": "Sonatine", "meaning": "Kleinere bzw. einfachere Sonate.", "category": "Formen"}, {"id": 86, "term": "Variation", "meaning": "Veränderte Wiederholung eines musikalischen Themas.", "category": "Formen"}, {"id": 87, "term": "Fuge", "meaning": "Kontrapunktische Form mit imitierenden Stimmen.", "category": "Formen"}, {"id": 88, "term": "Präludium", "meaning": "Ursprünglich ein Vorspiel; später eigenständige Form.", "category": "Formen"}, {"id": 89, "term": "Etüde", "meaning": "Übungsstück mit technischem oder musikalischem Schwerpunkt.", "category": "Formen"}, {"id": 90, "term": "Nocturne", "meaning": "Meist lyrisches, stimmungsvolles Charakterstück.", "category": "Gattungen"}, {"id": 91, "term": "Impromptu", "meaning": "Frei und scheinbar spontan improvisiertes Stück.", "category": "Gattungen"}, {"id": 92, "term": "Ballade", "meaning": "Erzählerisch oder lyrisch geprägte Instrumentalkomposition.", "category": "Gattungen"}, {"id": 93, "term": "Rhapsodie", "meaning": "Frei angelegte, oft kontrastreiche Komposition.", "category": "Gattungen"}, {"id": 94, "term": "Capriccio", "meaning": "Frei, fantasievoll und oft spielerisch angelegt.", "category": "Gattungen"}, {"id": 95, "term": "Fantasie", "meaning": "Frei gestaltete, nicht streng an eine Form gebundene Komposition.", "category": "Gattungen"}, {"id": 96, "term": "Scherzo", "meaning": "Schneller, meist scherzhafter oder bewegter Satz.", "category": "Gattungen"}, {"id": 97, "term": "Menuett", "meaning": "Historischer Tanz im Dreiertakt.", "category": "Tanzformen"}, {"id": 98, "term": "Walzer", "meaning": "Tanz im Dreiertakt mit typischem Schwung.", "category": "Tanzformen"}, {"id": 99, "term": "Mazurka", "meaning": "Polnischer Tanz im Dreiertakt.", "category": "Tanzformen"}, {"id": 100, "term": "Polonaise", "meaning": "Feierlicher polnischer Schreittanz.", "category": "Tanzformen"}, {"id": 101, "term": "Suite", "meaning": "Folge mehrerer stilisierter Tänze oder Sätze.", "category": "Gattungen"}, {"id": 102, "term": "Concerto", "meaning": "Komposition mit solistischem Instrument und Orchester.", "category": "Gattungen"}, {"id": 103, "term": "Sinfonie", "meaning": "Groß angelegte Komposition für Orchester.", "category": "Gattungen"}, {"id": 104, "term": "Cantabile", "meaning": "Gesanglich, wie eine Stimme spielen.", "category": "Ausdruck"}, {"id": 105, "term": "Dolce", "meaning": "Süß, zart, lieblich.", "category": "Ausdruck"}, {"id": 106, "term": "Espressivo", "meaning": "Ausdrucksvoll spielen.", "category": "Ausdruck"}, {"id": 107, "term": "Con brio", "meaning": "Mit Feuer, lebhaft und energisch.", "category": "Ausdruck"}, {"id": 108, "term": "Con moto", "meaning": "Mit Bewegung, bewegt.", "category": "Ausdruck"}, {"id": 109, "term": "Agitato", "meaning": "Aufgeregt, unruhig.", "category": "Ausdruck"}, {"id": 110, "term": "Maestoso", "meaning": "Majestätisch, würdevoll.", "category": "Ausdruck"}, {"id": 111, "term": "Sostenuto", "meaning": "Getragen, die Töne länger auskostend.", "category": "Ausdruck"}, {"id": 112, "term": "Tranquillo", "meaning": "Ruhig, gelassen.", "category": "Ausdruck"}];
const KEY="wagissimoProgressV2";
let progress=JSON.parse(localStorage.getItem(KEY)||"{}");
let state={screen:"home",learnIndex:0,revealed:false,quiz:[],q:0,correct:0,answered:false,wrong:[]};

function save(){localStorage.setItem(KEY,JSON.stringify(progress))}
function p(id){return progress[id]||{box:0,correct:0,wrong:0,next:0}}
function setP(id,known){
 let x=p(id); if(known){x.correct++;x.box=Math.min(5,x.box+1);x.next=Date.now()+[0,86400000,3*86400000,7*86400000,21*86400000,60*86400000][x.box]}
 else{x.wrong++;x.box=Math.max(0,x.box-1);x.next=Date.now()}
 progress[id]=x;save()
}
function due(){return TERMS.filter(t=>p(t.id).next<=Date.now()||!progress[t.id])}
function chooseQuiz(){
 let pool=[...due()].sort((a,b)=>(p(a.id).box-p(b.id).box)||Math.random()-.5);
 if(pool.length<10) pool=[...TERMS].sort((a,b)=>p(a.id).box-p(b.id).box||Math.random()-.5);
 return pool.slice(0,10)
}
function render(){
 if(state.screen==="home")home();
 if(state.screen==="learn")learn();
 if(state.screen==="quiz")quiz();
 if(state.screen==="result")result();
 if(state.screen==="stats")stats();
}
function nav(){["homeTab","learnTab","quizTab","statsTab"].forEach(id=>document.getElementById(id).classList.remove("active"));document.getElementById(state.screen==="home"?"homeTab":state.screen==="learn"?"learnTab":state.screen==="quiz"||state.screen==="result"?"quizTab":"statsTab").classList.add("active")}
function home(){
 state.screen="home";nav();
 const d=due().length;
 document.getElementById("content").innerHTML=`<div class="card"><div class="homeTitle">Hallo, Wagi! 👋</div><p>Dein musikalisches Gedächtnis wartet.</p><div class="grid"><div class="stat"><b>${TERMS.length}</b>Begriffe</div><div class="stat"><b>${d}</b>zur Wiederholung</div><div class="stat"><b>${Object.values(progress).filter(x=>x.correct).length}</b>gelernt</div><div class="stat"><b>${Object.values(progress).reduce((a,x)=>a+x.correct,0)}</b>richtige Antworten</div></div><button class="btn" onclick="startQuiz()">10er-Quiz starten</button><button class="btn secondary" onclick="startLearn()">Karteikarten lernen</button><p class="small">Wiederholungen werden automatisch priorisiert: Schwierige Begriffe kommen häufiger zurück.</p></div>`
}
function startLearn(){state.screen="learn";state.learnIndex=0;state.revealed=false;nav();render()}
function learn(){
 nav();let t=TERMS[state.learnIndex];
 document.getElementById("content").innerHTML=`<div class="card center"><div class="badge">${t.category.toUpperCase()}</div><div class="term">${t.term}</div>${state.revealed?`<div class="meaning">${t.meaning}</div><button class="btn" onclick="rateLearn(true)">✓ Gewusst</button><button class="btn secondary" onclick="rateLearn(false)">× Noch nicht</button>`:`<div class="small">Was bedeutet das?</div><button class="btn" onclick="state.revealed=true;render()">Antwort zeigen</button>`}<p class="small">${state.learnIndex+1} / ${TERMS.length}</p></div>`
}
function rateLearn(known){setP(TERMS[state.learnIndex].id,known);state.learnIndex=(state.learnIndex+1)%TERMS.length;state.revealed=false;render()}
function startQuiz(){state.screen="quiz";state.quiz=chooseQuiz();state.q=0;state.correct=0;state.answered=false;state.wrong=[];nav();render()}
function quiz(){
 nav();let t=state.quiz[state.q];let opts=[t.meaning];while(opts.length<4){let x=TERMS[Math.floor(Math.random()*TERMS.length)].meaning;if(!opts.includes(x))opts.push(x)}opts.sort(()=>Math.random()-.5);
 document.getElementById("content").innerHTML=`<div class="card center"><div class="progress"><div class="bar" style="width:${state.q/state.quiz.length*100}%"></div></div><div class="badge">FRAGE ${state.q+1} VON ${state.quiz.length} · ${t.category.toUpperCase()}</div><div class="term">${t.term}</div><div class="answers">${opts.map(x=>`<button type="button" data-answer="${encodeURIComponent(x)}">${x}</button>`).join("")}</div><p class="small">Wagi beobachtet dich. 👀</p></div>`;
 document.querySelectorAll(".answers button").forEach(b=>b.addEventListener("click",()=>answerQuiz(decodeURIComponent(b.dataset.answer))));
}
function answerQuiz(x){
 if(state.answered)return;state.answered=true;let t=state.quiz[state.q],ok=x===t.meaning;setP(t.id,ok);if(ok)state.correct++;else state.wrong.push(t);
 document.querySelectorAll(".answers button").forEach(b=>b.disabled=true);
 setTimeout(()=>{state.q++;state.answered=false;if(state.q>=state.quiz.length)state.screen="result";render()},350)
}
function result(){
 nav();let total=state.quiz.length, pct=Math.round(state.correct/total*100);
 let msg=pct===100?"Mozart würde nicken. 😎":pct>=80?"Sehr stark! Wagi ist beeindruckt.":pct>=60?"Solide! Da geht noch ein bisschen Wagi-Magie.":"Kein Drama. Genau dafür gibt es Wiederholung. 😉";
 document.getElementById("content").innerHTML=`<div class="card center"><div class="badge">QUIZ BEENDET</div><div class="resultScore">${pct}%</div><h2>${state.correct} von ${total} richtig</h2><p>${msg}</p><div class="grid"><div class="stat"><b>${total-state.correct}</b>noch üben</div><div class="stat"><b>${due().length}</b>Wiederholungen</div></div><button class="btn" onclick="startQuiz()">Neues 10er-Quiz</button>${state.wrong.length?`<button class="btn secondary" onclick="reviewWrong()">Nur Fehler wiederholen</button>`:""}<button class="btn secondary" onclick="home()">Zur Startseite</button></div>`
}
function reviewWrong(){state.quiz=[...state.wrong];state.q=0;state.correct=0;state.answered=false;state.wrong=[];state.screen="quiz";render()}
function stats(){
 nav();let mastered=TERMS.filter(t=>p(t.id).box>=4).length,correct=Object.values(progress).reduce((a,x)=>a+x.correct,0),wrong=Object.values(progress).reduce((a,x)=>a+x.wrong,0);
 document.getElementById("content").innerHTML=`<div class="card"><div class="homeTitle">Dein Fortschritt 📈</div><div class="grid" style="margin-top:16px"><div class="stat"><b>${mastered}</b>sehr sicher</div><div class="stat"><b>${correct}</b>richtig</div><div class="stat"><b>${wrong}</b>falsch</div><div class="stat"><b>${due().length}</b>heute fällig</div></div><div class="list">${TERMS.slice(0,15).map(t=>`<div class="row"><span>${t.term}</span><span>Stufe ${p(t.id).box}</span></div>`).join("")}</div></div>`
}
function home(){state.screen="home";nav();const d=due().length;document.getElementById("content").innerHTML=`<div class="card"><div class="homeTitle">Hallo, Wagi! 👋</div><p>Dein musikalisches Gedächtnis wartet.</p><div class="grid"><div class="stat"><b>${TERMS.length}</b>Begriffe</div><div class="stat"><b>${d}</b>zur Wiederholung</div><div class="stat"><b>${Object.values(progress).filter(x=>x.correct).length}</b>gelernt</div><div class="stat"><b>${Object.values(progress).reduce((a,x)=>a+x.correct,0)}</b>richtige Antworten</div></div><button class="btn" onclick="startQuiz()">10er-Quiz starten</button><button class="btn secondary" onclick="startLearn()">Karteikarten lernen</button><p class="small">Wiederholungen werden automatisch priorisiert: Schwierige Begriffe kommen häufiger zurück.</p></div>`}
document.getElementById("homeTab").onclick=home;
document.getElementById("learnTab").onclick=startLearn;
document.getElementById("quizTab").onclick=startQuiz;
document.getElementById("statsTab").onclick=()=>{state.screen="stats";render()};
home();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body></html>

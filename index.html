<head>

<style>
:root{--bg:#0f0d18;--card:#191525;--card2:#211c31;--text:#f8f6ff;--muted:#aaa2bd;--accent:#a97cff;--accent2:#65d8ff;--good:#57d99a;--bad:#ff7188;--line:#302942}

button{font:inherit;color:inherit;border:0;cursor:pointer}.wrap{max-width:760px;margin:auto;padding-bottom:95px}
header{padding:22px 18px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(15,13,24,.84);backdrop-filter:blur(18px);z-index:5}
.brand{display:flex;gap:10px;align-items:center;font-weight:900;font-size:22px}.logo{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#9c6cff,#59d7ff);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 30px #7d54d744}
.level{font-size:12px;background:#251e37;padding:8px 11px;border-radius:999px;color:#d9ceff}.hero{margin:8px 16px 18px;padding:22px;border:1px solid #3a3150;border-radius:25px;background:linear-gradient(145deg,#211a35,#171324);box-shadow:0 20px 55px #0005}
h1{margin:0 0 7px;font-size:29px;letter-spacing:-.7px}h2{margin:0 0 12px;font-size:21px}p{line-height:1.45}.muted{color:var(--muted)}
.xpbar{height:9px;background:#332b43;border-radius:99px;overflow:hidden;margin:12px 0 7px}.xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:.4s}.tiny{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:0 16px 18px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.stat b{font-size:23px;display:block}.stat span{font-size:12px;color:var(--muted)}
.card{margin:0 16px 13px;background:var(--card);border:1px solid var(--line);border-radius:21px;padding:18px}.term{font-size:27px;font-weight:900}.pill{display:inline-block;padding:6px 10px;border-radius:99px;background:#2b2340;color:#d8caff;font-size:12px;margin:8px 0}.definition{font-size:16px;line-height:1.55}.example{margin-top:13px;padding:12px 14px;border-left:3px solid var(--accent);background:#211b2e;border-radius:10px;color:#d9d3e6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{padding:14px 15px;border-radius:15px;background:#2a233b}.primary{background:linear-gradient(135deg,#9a6cff,#687dff);font-weight:800}.good{background:#19382e;color:#aaf0d0}.bad{background:#40202a;color:#ffb5c2}

.question{font-size:25px;font-weight:900;margin:15px 0}.choice{width:100%;text-align:left;margin:7px 0;padding:15px;border-radius:15px;background:#252037;border:1px solid #352d47}.choice:hover{background:#302749}.choice.correct{background:#174331;border-color:#4bd497}.choice.wrong{background:#47232e;border-color:#ff7188}
.result{text-align:center;padding:30px 18px}.score{font-size:58px;font-weight:950;background:linear-gradient(90deg,#c29bff,#69dcff);-webkit-background-clip:text;color:transparent}.badge{font-size:60px;margin:8px}
.ach{display:flex;gap:12px;align-items:center}.achicon{width:45px;height:45px;border-radius:14px;background:#2b2340;display:grid;place-items:center;font-size:23px}.locked{opacity:.4}.section{margin:22px 16px 10px;font-weight:800;color:#ddd5e8}.catrow{display:flex;align-items:center;gap:10px;margin:10px 0}.catbar{flex:1;height:8px;background:#302941;border-radius:9px;overflow:hidden}.catfill{height:100%;background:linear-gradient(90deg,#9b6cff,#65d8ff)}
.empty{text-align:center;padding:45px 15px;color:var(--muted)}

.notes-staff{position:relative;height:220px;margin:18px 0;border-radius:18px;background:#f7f3eb;overflow:hidden;color:#171225}
.staff-svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.staff-stem{stroke:#171225;stroke-width:3;stroke-linecap:round}
.note-answer{font-size:25px;font-weight:900;text-align:center;margin:10px 0}

.keyboard{display:flex;justify-content:center;position:relative;height:145px;margin:15px 0 8px;overflow:hidden;border-radius:14px;background:#0d0b12;padding:0 8px 8px}

const KEY="wagissimoProgressV4", USER="wagissimoUserV4";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let user=JSON.parse(localStorage.getItem(USER)||'{"xp":0,"streak":0,"last":"","daily":0,"total":0,"best":0}');
function save(){localStorage.setItem(KEY,JSON.stringify(state));localStorage.setItem(USER,JSON.stringify(user))}
function today(){return new Date().toISOString().slice(0,10)}
function addXP(n){user.xp+=n; user.total+=1; save()}
function level(){return Math.floor(user.xp/100)+1}
function xpIn(){return user.xp%100}
function touch(){let d=today();if(user.last!==d){let y=new Date();y.setDate(y.getDate()-1);let yd=y.toISOString().slice(0,10);user.streak=user.last===yd?user.streak+1:1;user.last=d;user.daily=0}user.daily++;save()}
function rec(i,correct){let r=state[i]||{box:0,correct:0,wrong:0,next:0};if(correct){r.correct++;r.box=Math.min(5,r.box+1);r.next=Date.now()+[0,864e5,3*864e5,7*864e5,21*864e5,60*864e5][r.box];addXP(10)}else{r.wrong++;r.box=Math.max(0,r.box-1);r.next=Date.now();addXP(2)}state[i]=r;touch();save()}
function mastered(){return Object.values(state).filter(x=>x.box>=5).length}
function due(){return TERMS.map((t,i)=>i).filter(i=>!state[i]||state[i].next<=Date.now()).sort((a,b)=>(state[a]?.box||0)-(state[b]?.box||0))}
function pctCat(c){let ids=TERMS.map((t,i)=>[t,i]).filter(x=>x[0][1]===c).map(x=>x[1]);return ids.length?Math.round(ids.filter(i=>state[i]?.box>=5).length/ids.length*100):0}
function setPage(p){document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.p===p)); if(p==="quiz")startQuiz(); else if(p==="notes")notesHome(); else render(p)}

else if(p==="learn")renderLearn(a);

function wagi(){let arr=["Allegro heißt schnell. Nicht: hektisch. 😌","Wenn du bei Crescendo lauter wirst, ist das Absicht. Wenn der Nachbar klingelt, war es vielleicht zu viel. 😂","Rubato bedeutet Freiheit. Aber bitte nicht vom Taktbuch flüchten. 🏃","Staccato: kurz. Deine Geduld beim Üben darf trotzdem lang sein. 😜","Die Dominante will nach Hause. Sie ist einfach sehr anhänglich. 🏠","Eine Fuge ist kein Küchenabfluss. Obwohl sie manchmal genauso komplex aussieht. 🌀","Etüde klingt französisch. Übersetzt heißt es ungefähr: Jetzt üben wir das nochmal. 🏋️","Maestoso: Stell dir vor, du betrittst einen Raum und alle warten schon auf dich. 👑"];return arr[Math.floor(Math.random()*arr.length)]}
function renderLearn(a){
let ids=due().slice(0,1); if(!ids.length){a.innerHTML=`<header><div class="brand">📚 Lernen</div><div class="level">LEVEL ${level()}</div></header><div class="empty">🎉 Alles erledigt!<br><br>Du hast momentan keine fälligen Begriffe.</div>`;return}
let i=ids[0],t=TERMS[i];a.innerHTML=`<header><div class="brand">📚 Lernen</div><div class="level">+10 XP möglich</div></header><div class="card"><div class="pill">${t[3]} ${t[1]}</div><div class="term">${t[0]}</div><p class="definition">${t[2]}</p><div class="example">💡 ${t[4]}</div><div class="actions"><button class="btn good" onclick="learned(${i})">✓ Kann ich</button><button class="btn bad" onclick="forgot(${i})">↻ Nochmal</button></div></div><div class="card"><b>🧠 Wagi-Merksatz</b><p class="muted">${memory(t[0])}</p></div>`}
function memory(x){let m={"Allegro":"ALLEGRO = Alarm? Nein. Aber ziemlich flott!","Crescendo":"CRESCENDO wächst – wie eine Lautstärke-Pflanze. 🌱","Dominante":"DOMINANTE = V. Stufe → will zur Tonika nach Hause.","Oktave":"OKTAVE = 8 Tonstufen. Gleicher Name, andere Etage.","Staccato":"STACCATO = kurz und knackig."};return m[x]||"Wiederholen macht aus einem Fremdwort irgendwann einen alten Bekannten. 😉"}
function learned(i){rec(i,true); render("learn");}
function forgot(i){rec(i,false); render("learn");}

let quiz=[],qi=0,score=0,wrong=[];
function startQuiz(){quiz=chooseQuiz();qi=0;score=0;wrong=[];renderQuiz()}
function chooseQuiz(){let ids=due(); if(ids.length<10){ids=[...ids,...TERMS.map((_,i)=>i).filter(i=>!ids.includes(i))]} return ids.slice(0,10).sort(()=>Math.random()-.5)}
function renderQuiz(){
let a=document.getElementById("app"); if(!quiz.length){a.innerHTML='<div class="empty">Keine Fragen verfügbar.</div>';return}
let i=quiz[qi],t=TERMS[i], type=Math.random()<.5?"meaning":"term";
let correct=type==="meaning"?t[2]:t[0];
let pool=TERMS.filter((_,j)=>j!==i).sort(()=>Math.random()-.5).slice(0,3).map(x=>type==="meaning"?x[2]:x[0]);
let opts=[correct,...pool].sort(()=>Math.random()-.5);
currentQuizOptions=opts; currentQuizCorrect=correct;
a.innerHTML=`<header><div class="brand">🎯 Quiz</div><div class="level">${qi+1} / ${quiz.length}</div></header><div class="card"><div class="tiny">+10 XP bei richtiger Antwort</div><div class="question">${type==="meaning"?"Was bedeutet:": "Welcher Begriff passt zu:"}<br><span style="color:#cbb8ff">${type==="meaning"?t[0]:"„"+t[2]+"“"}</span></div>${opts.map((o,k)=>`<button class="choice" onclick="answerQuiz(this,${k})">${o}</button>`).join("")}</div>`}
let currentQuizOptions=[];
let currentQuizCorrect="";
function answerQuiz(btn,k){
  document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
  const o=currentQuizOptions[k], c=currentQuizCorrect;
  const i=quiz[qi];
  const ok=o===c;
  btn.classList.add(ok?"correct":"wrong");
  if(ok)score++;else wrong.push(i);
  rec(i,ok);
  setTimeout(()=>{qi++; if(qi<quiz.length)renderQuiz();else showResult()},650)
}
function showResult(){let pct=Math.round(score/quiz.length*100);if(score>=(quiz.length*.8))confetti();let msg=score===10?"Wagi ist sprachlos. 🏆":score>=8?"Sehr stark! Wagi nickt anerkennend. 😎":score>=5?"Solide! Aber da geht noch was. 😏":"Keine Panik. Wagi hat auch klein angefangen. 😂";document.getElementById("app").innerHTML=`<div class="result"><div class="badge">${score===10?"🏆":score>=8?"🔥":score>=5?"🎵":"💪"}</div><h1>Quiz beendet!</h1><div class="score">${score}/${quiz.length}</div><p>${pct}% richtig</p><p class="muted">${msg}</p><div class="card">⭐ ${score*10} XP verdient<br>🔥 Lernserie: ${user.streak} Tage</div><div class="actions"><button class="btn primary" onclick="startQuiz()">🎯 Neues Quiz</button><button class="btn" onclick="reviewWrong()">🧠 Fehler wiederholen</button></div><button class="btn" style="margin-top:10px;width:100%" onclick="setPage('home')">🏠 Zur Startseite</button></div>`}
function reviewWrong(){if(!wrong.length){alert("Keine Fehler – perfekt! 🏆");return}quiz=[...new Set(wrong)];qi=0;score=0;wrong=[];renderQuiz()}
function renderStats(a){
a.innerHTML=`<header><div class="brand">🏆 Profil</div><div class="level">LEVEL ${level()}</div></header>
<div class="grid"><div class="stat"><b>⭐ ${user.xp}</b><span>XP</span></div><div class="stat"><b>🔥 ${user.streak}</b><span>Streak</span></div><div class="stat"><b>🧠 ${mastered()}</b><span>Meister</span></div><div class="stat"><b>🎯 ${user.total}</b><span>Antworten</span></div></div>
<div class="section">🏅 Achievements</div>${achievements().map(x=>`<div class="card ach ${x.ok?"":"locked"}"><div class="achicon">${x.icon}</div><div><b>${x.name}</b><div class="tiny">${x.desc}</div></div></div>`).join("")}
<div class="section">📊 Kategorien</div><div class="card">${cats.map(c=>`<div class="catrow"><span style="width:110px">${c}</span><div class="catbar"><div class="catfill" style="width:${pctCat(c)}%"></div></div><span class="tiny">${pctCat(c)}%</span></div>`).join("")}</div>
<div class="section">🎼 Symbol-Quiz</div><div class="card"><p class="muted">Erkenne wichtige Notations- und Dynamikzeichen.</p><button class="btn primary" style="width:100%" onclick="symbolQuiz()">🎼 Symbol-Quiz starten</button></div>`}
function achievements(){return[
{icon:"🌱",name:"Erster Schritt",desc:"1 Lernaktion",ok:user.total>=1},
{icon:"🎯",name:"Trefferquote",desc:"10 richtige Antworten",ok:Object.values(state).reduce((s,x)=>s+x.correct,0)>=10},
{icon:"🔥",name:"Dranbleiber",desc:"7 Tage Lernserie",ok:user.streak>=7},
{icon:"🧠",name:"Meister",desc:"10 Begriffe gemeistert",ok:mastered()>=10},
{icon:"🏆",name:"Wagissimo",desc:"100 XP gesammelt",ok:user.xp>=100},
{icon:"🌟",name:"Lexikon",desc:"50 Begriffe gemeistert",ok:mastered()>=50}
]}
let sq=[],sqi=0,ss=0;
function symbolQuiz(){sq=[...symbols].sort(()=>Math.random()-.5).slice(0,10);sqi=0;ss=0;renderSymbol()}
function renderSymbol(){let s=sq[sqi],correct=s[1],opts=[correct,...symbols.filter(x=>x[1]!==correct).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[1])].sort(()=>Math.random()-.5);document.getElementById("app").innerHTML=`<header><div class="brand">🎼 Symbol-Quiz</div><div class="level">${sqi+1} / ${sq.length}</div></header><div class="card" style="text-align:center"><div style="font-size:85px;margin:15px">${s[0]}</div><div class="question">Was bedeutet dieses Zeichen?</div>${opts.map((o,k)=>`<button class="choice" onclick="answerSymbol(this,${k})">${o}</button>`).join("")}</div>`}
let currentSymbolOptions=[];
let currentSymbolCorrect="";
function answerSymbol(btn,k){
  document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
  const o=currentSymbolOptions[k], c=currentSymbolCorrect;
  const ok=o===c;
  btn.classList.add(ok?"correct":"wrong");
  if(ok)ss++;
  addXP(ok?8:2);touch();
  setTimeout(()=>{sqi++;sqi<sq.length?renderSymbol():symbolResult()},550)
}
function symbolResult(){document.getElementById("app").innerHTML=`<div class="result"><div class="badge">🎼</div><h1>Symbol-Quiz fertig!</h1><div class="score">${ss}/${sq.length}</div><p>+${ss*8+(sq.length-ss)*2} XP</p><button class="btn primary" style="width:100%" onclick="symbolQuiz()">🔁 Nochmal</button><button class="btn" style="width:100%;margin-top:10px" onclick="setPage('stats')">🏆 Profil</button></div>`}
function confetti(){let c=document.createElement("div");c.className="confetti";for(let i=0;i<70;i++){let e=document.createElement("i");e.style.left=Math.random()*100+"%";e.style.top=(-10-Math.random()*20)+"%";e.style.transform=`rotate(${Math.random()*180}deg)`;e.style.animationDelay=Math.random()*.6+"s";c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}

const NOTE_KEY="wagissimoNotesV1";
let noteState=JSON.parse(localStorage.getItem(NOTE_KEY)||'{"correct":0,"wrong":0,"mastered":{},"speedBest":null}');
const noteSets={
  // Position 0 = unterste Notenlinie. Jede Zahl entspricht einem Schritt (Linie/Leerraum).
  // Violinschlüssel: unterste Linie = E4, oberste Linie = F5.
  treble:[
    ["C4",-2],["D4",-1],["E4",0],["F4",1],["G4",2],["A4",3],["H4",4],
    ["C5",5],["D5",6],["E5",7],["F5",8],["G5",9],["A5",10],["H5",11],["C6",12]
  ],
  // Bassschlüssel: unterste Linie = G2, oberste Linie = A3.
  bass:[
    ["C2",-4],["D2",-3],["E2",-2],["F2",-1],["G2",0],["A2",1],["H2",2],
    ["C3",3],["D3",4],["E3",5],["F3",6],["G3",7],["A3",8],["H3",9],["C4",10]
  ]
};
let noteMode="treble", noteRound=0, noteScore=0, noteQuestion=null, noteStart=0;

function saveNotes(){localStorage.setItem(NOTE_KEY,JSON.stringify(noteState))}
function notesHome(){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("active",b.dataset.p==="notes"));
  const masteredNotes=Object.values(noteState.mastered).filter(v=>v>=4).length;
  document.getElementById("app").innerHTML=`
  <header><div class="brand">🎹 Notenlernen</div><div class="level">LEVEL ${level()}</div></header>
  <div class="hero"><h1>Noten lesen – Schritt für Schritt 🎼</h1>
  <p class="muted">Erkenne Noten, finde sie auf dem Klavier und trainiere Geschwindigkeit.</p>
  <div class="actions">
    <button class="btn primary" onclick="noteGame('treble')">🎼 Violinschlüssel</button>
    <button class="btn" onclick="noteGame('bass')">🎵 Bassschlüssel</button>
  </div>
  <div class="actions">
    <button class="btn" onclick="noteGame('mixed')">🔀 Beide Schlüssel</button>
    <button class="btn" onclick="noteGame('speed')">⚡ Speed</button>
  </div>
  <div class="actions">
    <button class="btn primary" onclick="keyboardGame('noteToKey')">🎹 Note → Taste</button>
    <button class="btn" onclick="keyboardGame('keyToNote')">🔄 Taste → Note</button>
  </div></div>
  <div class="grid">
    <div class="stat"><b>🎯 ${noteState.correct}</b><span>richtig</span></div>
    <div class="stat"><b>❌ ${noteState.wrong}</b><span>falsch</span></div>
    <div class="stat"><b>🧠 ${masteredNotes}</b><span>gefestigt</span></div>
    <div class="stat"><b>⚡ ${noteState.speedBest===null?"–":noteState.speedBest.toFixed(2)+" s"}</b><span>Bestzeit</span></div>
  </div>
  <div class="section">📈 Dein Lernweg</div>
  <div class="card"><div class="lesson-list">
    <div class="lesson-item"><b>🟢 Stufe 1 · C–G</b><span>Grundlagen</span></div>
    <div class="lesson-item"><b>🟡 Stufe 2 · größerer Umfang</b><span>Aufbau</span></div>
    <div class="lesson-item"><b>🔴 Stufe 3 · beide Schlüssel</b><span>Fortgeschritten</span></div>
    <div class="lesson-item"><b>⚡ Stufe 4 · Speed</b><span>Automatisieren</span></div>
  </div></div>`;
}
function noteGame(mode){
  noteMode=mode; noteRound=0; noteScore=0;
  noteStart=mode==="speed"?performance.now():0;
  nextNoteQuestion();
}
function nextNoteQuestion(){
  if(noteRound>=10){noteResult();return}
  let set;
  if(noteMode==="treble"||noteMode==="speed") set=noteSets.treble;
  else if(noteMode==="bass") set=noteSets.bass;
  else set=Math.random()<.5?noteSets.treble:noteSets.bass;
  const idx=Math.floor(Math.random()*set.length);
  noteQuestion={note:set[idx][0],pos:set[idx][1],clef:(set===noteSets.treble?"treble":"bass")};
  renderNoteQuestion();
}
function renderNoteQuestion(){
  const n=noteQuestion;
  const pool=noteSets[n.clef].filter(x=>x[0]!==n.note).sort(()=>Math.random()-.5).slice(0,3).map(x=>x[0]);
  const opts=[n.note,...pool].sort(()=>Math.random()-.5);
  currentNoteOptions=opts;

  // Echtes 5-Linien-System: im Violinschlüssel ist E4 die unterste Linie,
  // im Bassschlüssel G2. Die Noten steigen Schritt für Schritt nach oben.
  const bottomY=150, lineGap=16, step=8;
  const y=bottomY-(n.pos*step);
  const noteX=205;
  const stemUp=n.pos<=4;
  const stemX=stemUp?noteX+11:noteX-11;
  const stemY2=stemUp?y-52:y+52;

  let extra='';
  if(n.pos<0){
    for(let p=-2;p>=n.pos;p-=2){
      const ly=bottomY-(p*step);
      extra+=`<line class="staff-line" x1="168" x2="242" y1="${ly}" y2="${ly}"/>`;
    }
  }
  if(n.pos>8){
    for(let p=10;p<=n.pos;p+=2){
      const ly=bottomY-(p*step);
      extra+=`<line class="staff-line" x1="168" x2="242" y1="${ly}" y2="${ly}"/>`;
    }
  }

  const lines=[0,1,2,3,4].map(i=>{
    const ly=bottomY-i*lineGap;
    return `<line class="staff-line" x1="70" x2="320" y1="${ly}" y2="${ly}"/>`;
  }).join('');
  const clef=n.clef==='treble'?'𝄞':'𝄢';
  const clefY=n.clef==='treble'?168:160;

  document.getElementById("app").innerHTML=`
  <header><div class="brand">🎹 ${noteMode==="speed"?"Speed-Training":"Notenquiz"}</div><div class="level">${noteRound+1} / 10</div></header>
  <div class="card"><div class="tiny">${n.clef==="treble"?"Violinschlüssel · E4 = 1. Linie":"Bassschlüssel · G2 = 1. Linie"}</div>
  <div class="notes-staff">
    <svg class="staff-svg" viewBox="0 0 375 220" aria-label="Notensystem mit ${n.note}">
      ${lines}
      ${extra}
      <text class="staff-clef" x="78" y="${clefY}">${clef}</text>
      <ellipse class="staff-note" cx="${noteX}" cy="${y}" rx="13" ry="9" transform="rotate(-18 ${noteX} ${y})"/>
      <line class="staff-stem" x1="${stemX}" y1="${y}" x2="${stemX}" y2="${stemY2}"/>
    </svg>
  </div>
  <div class="question">Welche Note ist das?</div>
  ${opts.map((o,k)=>`<button class="choice" onclick="answerNote(this,${k})">${o}</button>`).join("")}
  </div>`;
}

let currentNoteOptions=[];
function answerNote(btn,k){
  const o=currentNoteOptions[k], c=noteQuestion.note;
  document.querySelectorAll(".choice").forEach(x=>x.disabled=true);
  const ok=o===c;
  btn.classList.add(ok?"correct":"wrong");
  if(ok)noteScore++;else {}
  noteState[ok?"correct":"wrong"]++;
  noteState.mastered[c]=Math.min(5,(noteState.mastered[c]||0)+(ok?1:0));
  addXP(noteMode==="speed"? (ok?12:2) : (ok?10:2));
  touch();saveNotes();
  setTimeout(()=>{noteRound++;nextNoteQuestion()},500);
}
function noteResult(){
  let pct=Math.round(noteScore/10*100);
  if(noteScore>=8)confetti();
  let extra="";
  if(noteMode==="speed"){
    const elapsed=(performance.now()-noteStart)/1000/10;
    if(noteState.speedBest===null||elapsed<noteState.speedBest){noteState.speedBest=elapsed;saveNotes()}
    extra=`<div class="card">⚡ Durchschnitt: <b>${elapsed.toFixed(2)} s</b> pro Note</div>`;
  }
  document.getElementById("app").innerHTML=`
  <div class="result"><div class="badge">${noteScore>=8?"🎹":"🎼"}</div>
  <h1>Notentraining fertig!</h1><div class="score">${noteScore}/10</div>
  <p>${pct}% richtig</p>${extra}
  <p class="muted">${noteScore===10?"Wagi ist beeindruckt. Du liest Noten wie ein Profi. 🏆":noteScore>=8?"Sehr gut! Die Noten werden langsam zu alten Bekannten. 😎":"Weiter üben – genau dafür ist Wagissimo da. 💪"}</p>
  <div class="actions"><button class="btn primary" onclick="noteGame('${noteMode}')">🔁 Nochmal</button><button class="btn" onclick="notesHome()">🎹 Notenbereich</button></div>
  <button class="btn" style="margin-top:10px;width:100%" onclick="setPage('home')">🏠 Startseite</button></div>`;
}


let keyRound=0,keyScore=0,keyMode="noteToKey",keyCurrent=null;
const keyNotes=[
  ["C4","C"],["D4","D"],["E4","E"],["F4","F"],["G4","G"],["A4","A"],["B4","H"],
  ["C5","C"],["D5","D"],["E5","E"],["F5","F"],["G5","G"],["A5","A"],["B5","H"]
];
function keyboardHTML(selected=""){
  const whites=["C","D","E","F","G","A","H"];
  const blacks=["C#","D#","", "F#","G#","A#",""];
  return `<div class="keyboard">${whites.map((w,i)=>`<button class="whitekey ${selected===w?"selected":""}" onclick="keyAnswer(${JSON.stringify(w)})">${w}</button>${blacks[i]?`<button class="blackkey ${selected===blacks[i]?"selected":""}" onclick="keyAnswer(${JSON.stringify(blacks[i])})">${blacks[i]}</button>`:""}`).join("")}</div>`;
}
function keyboardGame(mode){keyMode=mode;keyRound=0;keyScore=0;nextKeyQuestion()}
function nextKeyQuestion(){
  if(keyRound>=10){keyResult();return}
  keyCurrent=keyNotes[Math.floor(Math.random()*keyNotes.length)];
  const note=keyCurrent[1], octave=keyCurrent[0];
  document.getElementById("app").innerHTML=`
  <header><div class="brand">🎹 ${keyMode==="noteToKey"?"Note → Taste":"Taste → Note"}</div><div class="level">${keyRound+1} / 10</div></header>
  <div class="card">
  ${keyMode==="noteToKey"?`<div class="tiny">Welche Klaviertaste gehört zu dieser Note?</div><div class="question" style="text-align:center;font-size:34px">🎼 ${note}${octave.slice(-1)}</div>`:`<div class="tiny">Welche Note gehört zu dieser Taste?</div><div class="question" style="text-align:center">🎹 ${note}${octave.slice(-1)}</div>`}
  ${keyboardHTML()}
  ${keyMode==="keyToNote"?`<div class="actions"><button class="btn" onclick="noteChoice('C')">C</button><button class="btn" onclick="noteChoice('D')">D</button></div><div class="actions"><button class="btn" onclick="noteChoice('E')">E</button><button class="btn" onclick="noteChoice('F')">F</button></div><div class="actions"><button class="btn" onclick="noteChoice('G')">G</button><button class="btn" onclick="noteChoice('A')">A</button></div><div class="actions"><button class="btn" onclick="noteChoice('H')">H</button></div>`:""}
  </div>`;
}
function keyAnswer(v){
  if(keyMode!=="noteToKey")return;
  const expected=keyCurrent[1];
  const ok=v===expected;
  document.querySelectorAll(".whitekey,.blackkey").forEach(x=>x.disabled=true);
  if(ok)keyScore++;
  noteState[ok?"correct":"wrong"]++;
  noteState.mastered[expected]=Math.min(5,(noteState.mastered[expected]||0)+(ok?1:0));
  addXP(ok?12:2);touch();saveNotes();
  setTimeout(()=>{keyRound++;nextKeyQuestion()},450);
}
function noteChoice(v){
  if(keyMode!=="keyToNote")return;
  const ok=v===keyCurrent[1];
  if(ok)keyScore++;
  noteState[ok?"correct":"wrong"]++;
  noteState.mastered[keyCurrent[1]]=Math.min(5,(noteState.mastered[keyCurrent[1]]||0)+(ok?1:0));
  addXP(ok?12:2);touch();saveNotes();
  document.querySelectorAll(".btn").forEach(x=>x.disabled=true);
  setTimeout(()=>{keyRound++;nextKeyQuestion()},450);
}
function keyResult(){
  if(keyScore>=8)confetti();
  document.getElementById("app").innerHTML=`<div class="result"><div class="badge">🎹</div><h1>Klaviertraining fertig!</h1><div class="score">${keyScore}/10</div><p>${keyScore*12+(10-keyScore)*2} XP verdient</p><p class="muted">${keyScore===10?"Perfekt! Deine Noten und Tasten verstehen sich prächtig. 🏆":keyScore>=8?"Sehr stark! Jetzt wird das langsam automatisch. 😎":"Noch ein paar Runden – dann sitzen die Tasten. 💪"}</p><div class="actions"><button class="btn primary" onclick="keyboardGame('${keyMode}')">🔁 Nochmal</button><button class="btn" onclick="notesHome()">🎹 Notenbereich</button></div></div>`;
}

function todaySession(){
  const termIds=due().slice(0,5);
  if(termIds.length){
    quiz=termIds;qi=0;score=0;wrong=[];
    renderQuiz();
  }else{
    keyboardGame("noteToKey");
  }
